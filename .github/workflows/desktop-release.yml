name: Build Windows desktop
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-desktop-lock.txt
      - name: Verify release tag matches desktop version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/version.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match desktop/version.json' }
      - run: python -m pip install -r requirements-desktop-lock.txt
      - name: Desktop regression tests (skipped when tests/ is not checked in)
        shell: pwsh
        run: |
          # tests/ 与 test_*.py 被 .gitignore 排除，云端检出里通常没有这些文件。
          # 缺目录时 unittest 会以 "Start directory is not importable" 直接失败，
          # 那会把整个构建卡死，所以这里显式跳过而不是留一个必挂的步骤。
          if (Test-Path tests) { python -m unittest discover -s tests -p test_desktop.py -v }
          else { Write-Host 'tests/ not tracked in this repository, skipping desktop regression tests' }
      - run: python scripts/build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: WorkBuddy2API-windows-x64
          path: |
            dist/*.exe
            dist/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WorkBuddy2API-windows-x64
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
